{% extends 'layout/base.html' %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<h1 class="texet-center text-success ">ĐĂNG NHẬP</h1>
<form method="post" action="/login">
    <div class="form-floating mb-3 mt-3">
        <input type="text" class="form-control" id="username" placeholder="Tên đăng nhập..." name="username">
        <label for="username">Tên đăng nhập</label>
    </div>

    <div class="form-floating mt-3 mb-3">
        <input type="text" class="form-control" id="password" placeholder="Nhập mật khẩu..." name="password">
        <label for="password">Mật khẩu</label>
    </div>

    <button class="btn btn-danger">Đăng nhập</button>
</form>
{% endblock %}
